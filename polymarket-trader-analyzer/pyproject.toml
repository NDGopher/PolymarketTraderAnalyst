[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyanalyst"
version = "1.0.0"
description = "Deep Polymarket trader analysis: full history, strategy, comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polyanalyst = "polyanalyst.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
