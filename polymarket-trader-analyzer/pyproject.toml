[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyanalyst"
version = "1.0.0"
description = "Deep Polymarket trader analysis: full history, strategy, comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "rich>=13.7",
  "typer>=0.12",
  "flask>=3.0",
  "websockets>=12.0",
  "cryptography>=42.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polyanalyst = "polyanalyst.cli:app"
suspension-lab = "suspension_lab.cli:main"
suspension-analyze = "suspension_lab.analyze_cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["polyanalyst*", "suspension_lab*"]
exclude = ["tests*", "samples*", "data*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
